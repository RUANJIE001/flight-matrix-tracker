name: Flight Price Matrix Monitor

on:
  schedule:
    # 避开整点拥堵高峰：每 4 小时第 38 分触发一次 (如 UTC 03:38, 07:38, 11:38...)
    # 对应北京时间 11:38, 15:38, 19:38, 23:38, 03:38, 07:38
    - cron: '38 */4 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 网页手动点击触发

jobs:
  check-flights:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 赋予 actions 向仓库 push commit 历史数据的权限

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装项目依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 缓存 Playwright 浏览器内核
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: 安装 Playwright Chromium 浏览器
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium --with-deps

      - name: 执行机票价格矩阵比价与监控
        env:
          # 从 GitHub Secrets 中读取敏感信息 (兼容 EMAIL_SENDER 与 EMAIL_USER 等多重别名)
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER || secrets.EMAIL_USER }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE || secrets.EMAIL_AUTH_TOKEN }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT || secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || secrets.EMAIL_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          # 可选：航线与目标覆盖
          ORIGIN: ${{ vars.ORIGIN }}
          DEST: ${{ vars.DEST }}
          DEPART_DATE: ${{ vars.DEPART_DATE }}
          RETURN_DATE: ${{ vars.RETURN_DATE }}
          TARGET_PRICE: ${{ vars.TARGET_PRICE }}
          NONSTOP: ${{ vars.NONSTOP }}
        run: |
          python tracker.py

      - name: 自动提交并推送历史价格数据 (history.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f history.json ]; then
            git add history.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自动归档最新机票抓取记录 [skip ci]" && git push)
          fi
