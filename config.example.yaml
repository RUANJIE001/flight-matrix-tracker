# 监控航线与目标配置
flight:
  origin: "PVG"          # 出发机场代码 (如 PVG, SHA, PEK, CAN)
  dest: "TYO"            # 目的机场或城市代码 (如 TYO, HND, NRT, FUK, BKK)
  trip_type: "roundtrip" # roundtrip (往返) 或 oneway (单程)
  depart_date: "2026-10-24" # 基准出发日期 YYYY-MM-DD
  return_date: "2026-10-31" # 基准返程日期 (往返时必填) YYYY-MM-DD
  nonstop: true          # 是否仅直飞
  target_price: 2500     # 目标期望价格 (低于或等于该价格时立即发送达标邮件)
  flexible_days: 1       # 弹性天数 (1 表示 ±1 天共 9 组组合矩阵；0 表示仅查单一日)

# 抓取数据源平台开关
platforms:
  google_flights: true   # Google Flights (主力源，最全航司直连)
  ctrip: true            # 携程 / Trip.com (OTA 低价源)
  skyscanner: true       # 天巡 Skyscanner (聚合比价源)

# 邮件通知配置 (支持 QQ邮箱、163邮箱、Gmail、Outlook 等)
# 提示: 在 GitHub Actions 运行时，推荐将账号密码配置在 GitHub Secrets 中
email:
  enabled: true
  smtp_server: "smtp.qq.com"  # 163 邮箱为 smtp.163.com, Gmail 为 smtp.gmail.com
  smtp_port: 465              # SSL 端口通常为 465，TLS 端口通常为 587
  use_ssl: true
  sender_email: "your_email@qq.com"
  sender_auth_code: "your_smtp_auth_code" # 邮箱授权码/应用密码 (非登录密码)
  recipient_email: "your_target_email@qq.com"
  notify_on: "always"         # "hit" (仅达标时发送) 或 "always" (每次定时都发送矩阵报表)

# 移动端即时推送 (可选，留空则不启用)
webhook:
  bark_url: ""        # iOS Bark 推送地址，如 https://api.day.app/your_key/
  feishu_webhook: ""  # 飞书群机器人 Webhook 地址
  serverchan_key: ""  # Server酱微信推送 SendKey
